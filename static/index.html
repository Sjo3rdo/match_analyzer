<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Match Analyzer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232be58e'/%3E%3Ctext x='16' y='22' font-size='17' text-anchor='middle'%3E%E2%9A%BD%3C/text%3E%3C/svg%3E">
  <script>
    // thema kiezen vóór het tekenen, zodat de pagina niet eerst wit flitst
    try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand"><span class="logo">⚽</span><span>Match Analyzer<small>wedstrijdanalyse</small></span></a>
    <nav id="tabs"></nav>
    <div class="topbar-right">
      <span id="train-indicator"></span>
      <button id="theme-toggle" class="theme-toggle" title="Licht of donker"></button>
      <span id="version" class="muted small" title="Versie van de app"></span>
    </div>
  </header>
  <main id="view"></main>
  <div id="toast"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
